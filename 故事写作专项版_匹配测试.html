<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>故事写作指路图书馆</title>
<style>
  :root{
    --bg1:#2b2118; --bg2:#14100c;
    --panel:rgba(32,25,18,.86); --panel2:rgba(48,38,27,.7);
    --line:rgba(212,168,83,.32); --line2:rgba(212,168,83,.16);
    --gold:#d4a853; --gold2:#b8893a;
    --ink:#e8dcc0; --ink2:#c9b48a; --ink3:#9b8a6e;
    --green:#8fae7a; --red:#c87a6a;
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:var(--serif);
    background:radial-gradient(ellipse 120% 80% at 50% -10%,var(--bg1),var(--bg2) 70%);
    background-attachment:fixed;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding:0 0 env(safe-area-inset-bottom)}
  header.top{padding:16px 20px 8px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .lamp{font-size:22px;filter:drop-shadow(0 0 8px rgba(212,168,83,.6));animation:flick 4s ease-in-out infinite}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.75}55%{opacity:.95}}
  .brand{font-size:14px;letter-spacing:.14em;color:var(--ink2)}
  .brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--ink3);margin-top:2px}
  .dots{margin-left:auto;display:flex;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(212,168,83,.22);transition:.4s}
  .dot.on{background:var(--gold);box-shadow:0 0 8px rgba(212,168,83,.7)}
  .dot.done{background:var(--gold2)}
  main{flex:1;display:flex;flex-direction:column;padding:8px 20px 24px;position:relative;z-index:1}

  .scene{font-size:30px;text-align:center;margin:6px 0 2px;line-height:1;letter-spacing:.1em}
  .narrator{font-size:13.5px;line-height:1.9;color:var(--ink3);font-style:italic;text-align:center;margin:6px 4px 14px}
  .speak{position:relative;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px 12px 40px;font-size:13.5px;line-height:1.8;color:var(--ink2);margin:0 0 18px}
  .speak:before{content:"导";position:absolute;left:11px;top:12px;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;font-size:11px;color:var(--gold);display:flex;align-items:center;justify-content:center}
  .act{font-size:11px;letter-spacing:.25em;color:var(--gold);text-align:center;margin-bottom:8px}
  h1.q{font-size:19px;line-height:1.6;text-align:center;margin:4px 0 20px;font-weight:600;color:var(--ink)}

  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{display:flex;align-items:center;gap:13px;min-height:60px;padding:12px 13px;background:var(--panel);border:1px solid var(--line);border-radius:13px;cursor:pointer;transition:transform .18s,border-color .18s,background .18s;text-align:left;color:var(--ink);font-family:inherit;width:100%}
  .opt:active{transform:scale(.98)}
  .opt:hover{border-color:var(--gold);background:rgba(212,168,83,.08)}
  .opt .ico{width:42px;height:42px;flex-shrink:0;border-radius:11px;background:linear-gradient(145deg,rgba(212,168,83,.18),rgba(212,168,83,.04));border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:21px}
  .opt .body{flex:1;min-width:0}
  .opt .lb{font-size:14px;font-weight:600;color:var(--gold);margin-bottom:3px}
  .opt .tx{font-size:12.5px;line-height:1.6;color:var(--ink2)}
  .opt .sk{font-size:10.5px;color:var(--ink3);margin-top:4px}
  .opt.sel{border-color:var(--gold);background:rgba(212,168,83,.15);box-shadow:0 0 0 1px var(--gold),0 8px 24px rgba(0,0,0,.3)}

  .btn{display:block;width:100%;min-height:52px;margin-top:22px;border:none;border-radius:13px;background:linear-gradient(145deg,var(--gold),var(--gold2));color:#1c150d;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:transform .18s,filter .18s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--gold);font-weight:500}
  .prev-btn{margin-top:9px;min-height:42px;font-size:13px}
  .hint{font-size:11px;color:var(--ink3);text-align:center;margin-top:12px;line-height:1.7}

  /* 结局 */
  .res-head{text-align:center;padding:10px 0 4px}
  .res-tag{font-size:10px;letter-spacing:.3em;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:4px 12px;display:inline-block;margin-bottom:12px}
  h1.res-title{font-size:25px;line-height:1.4;margin:0 0 14px;color:var(--ink);letter-spacing:.03em}
  .guide{font-size:15px;line-height:1.9;color:var(--gold);font-style:italic;padding:14px 16px;border-left:2px solid var(--gold);background:var(--panel2);border-radius:0 10px 10px 0;margin-bottom:6px}
  .sec-t{font-size:11px;letter-spacing:.28em;color:var(--ink3);margin:24px 0 12px;display:flex;align-items:center;gap:10px}
  .sec-t:after{content:"";flex:1;height:1px;background:var(--line2)}

  .book{display:flex;gap:13px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:11px;opacity:0;transform:translateY(18px)}
  .book.in{animation:bookIn .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes bookIn{to{opacity:1;transform:none}}
  /* 主攻：更大、更深、更亮，凸显为今晚第一本 */
  .book.main{padding:18px 16px;background:linear-gradient(135deg,rgba(212,168,83,.16),rgba(212,168,83,.04));border-color:var(--gold2);box-shadow:0 0 0 1px rgba(212,168,83,.28),0 8px 22px rgba(0,0,0,.32)}
  .book.main .cover{width:60px;height:82px;font-size:26px}
  .book.main .bname{font-size:17px}
  .book.main .match .num{font-size:31px}
  .book.main .role{background:var(--gold);color:#241a10;border-color:var(--gold);font-weight:700}
  .book .cover{width:50px;height:68px;flex-shrink:0;border-radius:4px 8px 8px 4px;background:linear-gradient(135deg,#7a5a34,#3d2c1a);border:1px solid var(--gold2);box-shadow:inset 3px 0 6px rgba(0,0,0,.4),3px 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:22px;position:relative}
  .book .cover:before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.12)}
  .book .bi{flex:1;min-width:0}
  .role{display:inline-block;font-size:9.5px;letter-spacing:.1em;padding:2px 8px;border-radius:10px;background:rgba(212,168,83,.15);color:var(--gold);border:1px solid var(--line2);margin-bottom:5px}
  .role.bz{background:rgba(143,174,122,.14);color:var(--green);border-color:rgba(143,174,122,.3)}
  .role.kz{background:rgba(200,122,106,.14);color:var(--red);border-color:rgba(200,122,106,.3)}
  .bname{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:2px}
  .bmeta{font-size:10.5px;color:var(--ink3);margin-bottom:5px;line-height:1.4}
  .bauthor{display:inline-block;font-size:11px;font-weight:400;color:var(--gold);margin-left:6px;white-space:nowrap}
  .bpitch{font-size:12px;line-height:1.65;color:var(--ink3)}
  .match{margin-left:auto;flex-shrink:0;text-align:center;align-self:center}
  .match .num{font-size:26px;font-weight:700;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
  .match .pct{font-size:10px;color:var(--ink3);margin-top:2px}

  .rec{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--line2)}
  .rec:last-child{border-bottom:none}
  .rec .rn{width:22px;height:22px;flex-shrink:0;border-radius:6px;background:rgba(212,168,83,.12);border:1px solid var(--line2);color:var(--gold);font-size:11px;display:flex;align-items:center;justify-content:center}
  .rec .rb{flex:1;min-width:0}
  .rec .rname{font-size:13.5px;font-weight:600;color:var(--ink)}
  .rec .rrole{font-size:9.5px;color:var(--gold);margin-left:7px;font-weight:400}
  .rec .rtext{font-size:11.5px;line-height:1.7;color:var(--ink3);margin-top:3px}
  .rec-list{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px 12px;opacity:0;transform:translateY(14px);max-height:15px;overflow:hidden;transition:max-height .55s cubic-bezier(.2,.8,.2,1)}
  .rec-list.in{animation:bookIn .6s ease forwards}
  .rec-list:not(.open){-webkit-mask-image:linear-gradient(#000 12%,transparent);mask-image:linear-gradient(#000 12%,transparent)}
  .rec-list.open{max-height:3000px}
  .rec-more{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;min-height:46px;padding:7px 0 2px;margin-top:2px;background:none;border:none;color:var(--gold);font-family:var(--serif);cursor:pointer;opacity:0;transition:opacity .5s ease}
  .rec-more.in{opacity:1}
  .rec-more .tri{font-size:15px;line-height:1;animation:bob 1.9s ease-in-out infinite}
  .rec-more .more-tx{font-size:10px;letter-spacing:.14em;color:var(--ink3)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  .rec-more.open .tri{transform:rotate(180deg);animation:none}

  /* 过渡层 */
  .trans{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at center,#241b13,#0c0907);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s}
  .trans.on{opacity:1;pointer-events:all}
  .page{width:150px;height:200px;border-radius:6px;background:linear-gradient(135deg,#e8dcc0,#c9b48a);box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#3a2a18;font-size:40px;transform-origin:left center;position:relative}
  .page:after{content:"";position:absolute;inset:10px;border:1px solid rgba(90,64,34,.2);border-radius:3px;pointer-events:none}
  .trans.on .page{animation:flip 2s cubic-bezier(.5,.05,.3,1) forwards}
  @keyframes flip{0%{transform:perspective(600px) rotateY(0) translateX(0);opacity:0}
    25%{transform:perspective(600px) rotateY(-10deg) translateX(0);opacity:1}
    75%{transform:perspective(600px) rotateY(-30deg) translateX(-10px);opacity:1}
    100%{transform:perspective(600px) rotateY(-75deg) translateX(-40px);opacity:.15}}
  .trans .tt{color:var(--ink2);font-size:14px;letter-spacing:.15em;margin-top:26px;text-align:center;line-height:1.9;padding:0 30px}
  .loader{width:34px;height:34px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}
  @keyframes spin{to{transform:rotate(360deg)}}

  footer.ft{flex-shrink:0;padding:10px 20px 18px;text-align:center}
  .replay{display:none;width:100%;min-height:50px;border:1px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font-family:inherit;font-size:14px;letter-spacing:.12em;cursor:pointer}
  .replay.show{display:block}
  .replay:active{background:rgba(212,168,83,.1)}

  @media (max-height:680px){
    .scene{font-size:24px;margin:2px 0}
    .narrator{margin:4px 4px 10px;font-size:12.5px}
    .speak{margin-bottom:12px;padding:10px 12px 10px 38px}
    h1.q{font-size:17px;margin:2px 0 14px}
    .opt{min-height:54px;padding:10px 12px}
    .opt .ico{width:38px;height:38px;font-size:19px}
    .btn{margin-top:14px}
  }
  /* ===== 结局页反馈：折叠区下方、页脚上方 ===== */
  .fdb{margin-top:26px;padding:18px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--panel2);text-align:left}
  .fdb-title{font-size:14px;color:var(--gold);letter-spacing:.06em;margin-bottom:8px}
  .fdb-hint{font-size:11.5px;color:var(--ink3);margin:6px 0 10px}
  .fdb-stars{display:flex;flex-wrap:wrap;gap:6px}
  .fdb-star{position:relative;cursor:pointer}
  .fdb-star input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .fdb-star span{display:block;padding:6px 7px;border:1px solid var(--line2);border-radius:8px;color:var(--ink3);font-size:15px;letter-spacing:1px}
  .fdb-star input:checked+span{color:var(--gold);border-color:var(--gold);background:rgba(212,168,83,.12)}
  .fdb-star input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
  .fdb-textarea,.fdb-input{width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:13px;box-sizing:border-box}
  .fdb-textarea{resize:vertical;min-height:64px}
  .fdb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .fdb-tag{padding:5px 9px;border:1px solid var(--line2);border-radius:999px;background:none;color:var(--ink2);font-family:inherit;font-size:11.5px;cursor:pointer}
  .fdb-btn{width:100%;min-height:46px;margin-top:12px;border:1px solid var(--gold);border-radius:10px;background:var(--gold);color:#1a1408;font-family:inherit;font-size:13.5px;letter-spacing:.1em;cursor:pointer}
  .fdb-btn:disabled{opacity:.45;cursor:not-allowed}
  .fdb-msg{min-height:18px;margin-top:8px;text-align:center;font-size:12px;color:var(--gold)}
  /* 反馈区折叠：默认收起，与结局折叠同款三角/过渡 */
  .fdb{padding:0;overflow:hidden}
  .fdb-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 16px;border:none;background:none;color:var(--gold);font-family:inherit;font-size:13.5px;letter-spacing:.08em;cursor:pointer}
  .fdb-toggle .tri{font-size:12px;color:var(--gold);transition:transform .35s}
  .fdb-toggle.open .tri{transform:rotate(180deg)}
  .fdb-panel{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s cubic-bezier(.2,.8,.2,1),opacity .35s}
  .fdb-panel.open{max-height:1400px;opacity:1}
  .fdb-inner{padding:2px 16px 18px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="lamp">🕯️</div>
    <div class="brand">故事写作指路图书馆<small>STORY WRITING · 20 PORTRAITS</small></div>
    <div class="dots" id="dots"></div>
  </header>
  <main id="stage"></main>
  <footer class="ft"><button class="replay" id="replay">↺ 重新走一条路</button><a href="index.html" style="display:block;margin-top:12px;color:var(--gold);font-family:inherit;font-size:13px;letter-spacing:.1em;text-decoration:none;opacity:.85">← 返回选择版本</a><div style="margin-top:22px;font-size:11px;color:var(--muted);opacity:.72">写作指路图书馆 · 由 资深扑街阿花 制作</div></footer>
</div>
<div class="trans" id="trans"><div class="page">📖</div><div class="tt" id="transTxt"></div></div>

<script>
/* ===== 结局页反馈：CloudBase 接收端在联调时填入 HTTP 访问服务地址 ===== */
const FEEDBACK_ENDPOINT = "https://write-and-read-d8g1608td872c7963-1538285430.ap-shanghai.app.tcloudbase.com/api/feedback";
const FEEDBACK_VERSION = "专项版";
function feedbackHtml(endingId){
  return `
    <section class="fdb" aria-label="结果反馈">
      <button type="button" class="fdb-toggle" id="fdbToggle" aria-expanded="false" aria-controls="fdbPanel">
        <span>给这座图书馆的评价与建议</span><span class="tri" aria-hidden="true">▼</span>
      </button>
      <div class="fdb-panel" id="fdbPanel">
        <div class="fdb-inner">
          <div class="fdb-title">这次推荐，对你有用吗？</div>
          <div class="fdb-hint">给这次结果打个分</div>
          <div class="fdb-stars" role="radiogroup" aria-label="1 到 5 分评分">
            ${[1,2,3,4,5].map(n=>`<label class="fdb-star"><input type="radio" name="fdbScore" value="${n}" aria-label="${n} 分"><span>${"★".repeat(n)}</span></label>`).join("")}
          </div>
          <textarea class="fdb-textarea" id="fdbText" rows="3" maxlength="500" placeholder="给这次荐书结果的评价（选填）"></textarea>
          <textarea class="fdb-textarea" id="fdbWant" rows="3" maxlength="120" placeholder="你还希望有什么写作相关小工具？（选填）"></textarea>
          <button type="button" class="fdb-btn" id="fdbSubmit" disabled>提交反馈</button>
          <div class="fdb-msg" id="fdbMsg" role="status" aria-live="polite"></div>
          <input type="hidden" id="fdbEnding" value="${endingId}">
          <input type="hidden" id="fdbVersion" value="${FEEDBACK_VERSION}">
        </div>
      </div>
    </section>`;
}
function initFeedback(){
  const box=document.querySelector(".fdb"); if(!box) return;
  const toggle=document.getElementById("fdbToggle"), panel=document.getElementById("fdbPanel");
  const btn=document.getElementById("fdbSubmit"), msg=document.getElementById("fdbMsg");
  const endingId=document.getElementById("fdbEnding").value, version=document.getElementById("fdbVersion").value;
  const key="fb_submitted_"+endingId+"_"+version;
  let submitted=false;
  try{submitted=localStorage.getItem(key)==="1"}catch(e){}
  toggle.addEventListener("click",()=>{
    const open=!panel.classList.contains("open");
    panel.classList.toggle("open",open); toggle.classList.toggle("open",open);
    toggle.setAttribute("aria-expanded",open?"true":"false");
  });
  if(submitted){
    btn.disabled=true; btn.textContent="您已经提交"; btn.classList.add("done");
    return;
  }
  box.querySelectorAll('input[name="fdbScore"]').forEach(r=>r.addEventListener("change",()=>{btn.disabled=false;msg.textContent=""}));
  box.querySelectorAll(".fdb-tag").forEach(t=>t.addEventListener("click",()=>{
    const inp=document.getElementById("fdbWant");
    inp.value=(inp.value?inp.value.replace(/[、,，]\s*$/,"")+"、":"")+t.dataset.tag;
    inp.focus();
  }));
  btn.addEventListener("click",async()=>{
    const score=box.querySelector('input[name="fdbScore"]:checked');
    if(!score){msg.textContent="请先选择 1 到 5 分。";return}
    if(!FEEDBACK_ENDPOINT){msg.textContent="接收端尚未配置，暂不能提交。";return}
    const rating=Number(score.value);
    const text=document.getElementById("fdbText").value.trim();
    const wish=document.getElementById("fdbWant").value.trim();
    const payload={rating:Number(score.value),text:document.getElementById("fdbText").value.trim(),wish:document.getElementById("fdbWant").value.trim(),endingId:endingId,version:version};
    try{
      const res=await fetch(FEEDBACK_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(!res.ok) throw new Error(String(res.status));
      msg.textContent="收到了，谢谢。";
      try{localStorage.setItem(key,"1")}catch(e){}
      btn.disabled=true; btn.textContent="您已经提交"; btn.classList.add("done");
    }catch(e){msg.textContent="提交失败，请稍后再试。"}
  });
}

/* ===================== 纯逻辑函数 ===================== */
function getBook(id){ return DATA.books[id] || null; }
function toneGroupOf(fam){ return DATA.genreToTone[fam] || "neutral"; }

/* 匹配度 = 基础分 + 文体一致 +3 / 不一致 −3，封顶95保底80 */
function calcMatch(base, genre, toneValue){
  let adj=0; const g=toneGroupOf(genre);
  if(toneValue && toneValue!=="undecided" && g!=="neutral"){
    adj=(g===toneValue)?3:-3;
  }
  return Math.max(80,Math.min(95,base+adj));
}
function rolesOf(book, coreFamilies, coreSubs){
  const parts=book.family.split("/"); const fam=parts[0], sub=parts[1]||""; const r=[];
  if(coreFamilies.has(fam)) r.push("same");
  if(!coreSubs.has(sub)) r.push("cross");
  if(book.tags.some(t=>["指南","工具","手册","练习","训练","方法","模板","框架","范例","理论"].includes(t))) r.push("practice");
  if(book.level<=2) r.push("light");
  return r;
}
function recText(book, role, primaryName, bridge){
  const tpl=DATA.templates[role]||DATA.templates.same;
  return book.pitch+" "+tpl.replace(/\{primary\}/g,primaryName).replace(/\{bridge\}/g,bridge).replace(/\{rec\}/g,book.name);
}
/* 相关推荐：标签重合打分 + 文体过滤 + 卡点配比 + 补齐6本；排除核心三本（书名+作者键） */
function buildRecommendations(end, mainBook, suppId, extId, toneValue, blockValue){
  const trio=[mainBook, getBook(suppId), getBook(extId)].filter(Boolean);
  const coreFamilies=new Set(trio.map(b=>b.family.split("/")[0]));
  const coreSubs=new Set(trio.map(b=>(b.family.split("/")[1]||"")));
  const targetTags=new Set();
  trio.concat([{tags:end.tags}]).forEach(b=>(b.tags||[]).forEach(t=>targetTags.add(t)));
  let scored=DATA.extPool.map(id=>getBook(id)).filter(Boolean).map(book=>{
    const overlap=book.tags.filter(t=>targetTags.has(t)).length;
    const fam=toneGroupOf(book.family.split("/")[0]);
    const toneMismatch=toneValue&&toneValue!=="undecided"&&fam!=="neutral"&&toneValue!==fam;
    return {book, score:overlap*2-(toneMismatch?6:0), overlap, toneMismatch, roles:rolesOf(book,coreFamilies,coreSubs)};
  });
  scored.sort((a,b)=>b.score-a.score||b.overlap-a.overlap);
  const quota=Object.assign({},DATA.blockQuota._default,DATA.blockQuota[blockValue]||{});
  const used=new Set(), picked=[]; const order=["same","cross","practice","light"];
  order.forEach(role=>{
    let need=quota[role]||0;
    for(const s of scored){
      if(need<=0) break;
      if(used.has(s.book.family+"|"+s.book.name)) continue;
      if(!s.roles.includes(role)) continue;
      used.add(s.book.family+"|"+s.book.name); picked.push({book:s.book,role}); need--;
    }
  });
  if(picked.length<6){
    for(const s of scored){
      if(picked.length>=6) break;
      const key=s.book.family+"|"+s.book.name;
      if(used.has(key)) continue;
      used.add(key); picked.push({book:s.book,role:s.roles[0]||"same"});
    }
  }
  const coreKeys=new Set(trio.map(b=>b.name+"|"+(b.author||"待确认")));
  const recKey=b=>b.name+"|"+(b.author||"待确认");
  const roleName={same:"同族深化",cross:"跨族补短",practice:"练习工作本",light:"轻量速查"};
  return picked.filter(p=>!coreKeys.has(recKey(p.book))).slice(0,6).map(p=>({
    name:p.book.name, role:p.role, roleLabel:roleName[p.role]||"相关推荐",
    text:recText(p.book,p.role,mainBook.name,"短板")
  }));
}

/* ===== UI 逻辑 ===== */
const stage=document.getElementById("stage");
const dotsEl=document.getElementById("dots");
const trans=document.getElementById("trans");
const transTxt=document.getElementById("transTxt");
const replayBtn=document.getElementById("replay");
let S={screen:"intro",qi:0,answers:{},style:null,tone:null,block:null,busy:false};
let QHISTORY=[];   // 已走过的题目索引栈
let START_ANSWERS={}; // 进入本题时的答案快照，用于判断是否改选

function setDots(){
  dotsEl.innerHTML=""; const total=DATA.questions.length;
  for(let i=0;i<total;i++){
    const d=document.createElement("div");
    d.className="dot"+(S.screen==="question"&&i===S.qi?" on":"")+
      ((S.screen!=="intro"&&i<S.qi)||S.screen==="ending"?" done":"");
    dotsEl.appendChild(d);
  }
}
function renderIntro(){
  S.screen="intro"; setDots(); replayBtn.classList.remove("show");
  const paras=DATA.meta.opening.map(t=>`<p class="narrator" style="margin:0 0 8px">${t}</p>`).join("");
  stage.innerHTML=`
    <div class="scene" style="font-size:42px;margin:18px 0 20px">🚪</div>
    <div style="background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:20px 16px">${paras}</div>
    <button class="btn" id="start">推门而入 →</button>
    <div class="hint">4 层提问，约 3—5 分钟 · 每层选最接近你此刻状态的那一个</div>`;
  document.getElementById("start").onclick=()=>gotoQuestion(0);
}
function renderQuestion(i){
  S.screen="question"; S.qi=i; setDots(); replayBtn.classList.remove("show");
  START_ANSWERS=Object.assign({},S.answers);
  const q=DATA.questions[i];
  const speak=q.speak?`<div class="speak">${q.speak}</div>`:"";
  const hint=q.hint?`<div class="hint" style="margin:0 0 12px">${q.hint}</div>`:"";
  const confirmNote=q.kind==="confirm"?`<div class="hint">这一层可凭直觉选，不影响你今晚带走的书。</div>`:"";
  const opts=q.options.map(o=>`
    <button class="opt${S.answers[q.qid]===o.code?" sel":""}" data-code="${o.code}">
      <span class="ico">${o.ico}</span>
      <span class="body"><span class="lb">${o.label}</span>${(o.text && o.text!==o.label)?`<span class="tx">${o.text}</span>`:""}${o.sk?`<span class="sk">${o.sk}</span>`:""}</span>
    </button>`).join("");
  stage.innerHTML=`
    <div class="scene">${q.icon}</div>
    <div class="act">${q.act}</div>
    ${speak}${hint}
    <h1 class="q">${q.title}</h1>
    <div class="opts">${opts}</div>
    ${i>0?'<button class="btn ghost prev-btn" id="prevBtn">← 回到上一题</button>':''}
    ${confirmNote}`;
  stage.querySelectorAll(".opt").forEach(btn=>{ btn.onclick=()=>choose(i,btn); });
  const pb=document.getElementById("prevBtn");
  if(pb) pb.onclick=()=>goPrev(i);
}
function choose(i,btn){
  if(S.busy) return; S.busy=true;
  const q=DATA.questions[i]; const code=btn.dataset.code;
  btn.classList.add("sel");
  stage.querySelectorAll(".opt").forEach(b=>{b.style.pointerEvents="none";if(b!==btn)b.style.opacity=".5";});
  // 改选判定：进入本题时的快照与现在不同 → 清空后续所有题答案
  const before=START_ANSWERS[q.qid];
  if(before && before!==code){
    for(let j=i+1;j<DATA.questions.length;j++) delete S.answers[DATA.questions[j].qid];
  }
  S.answers[q.qid]=code;
  if(QHISTORY[QHISTORY.length-1]!==i) QHISTORY.push(i);
  if(q.kind==="cluster") S.tone=(code==="D")?"pro":((code==="A"||code==="B"||code==="C"||code==="E")?"novel":"undecided");
  if(q.kind==="confirm") S.block=code;
  const last=i===DATA.questions.length-1;
  const msg=last
    ? `<div class="loader"></div>管理员正在从书架上取书……<br><span style="font-size:11px;color:var(--ink3)">${DATA.meta.toResult}</span>`
    : (i===1?"管理员记下了你卡住的地方……":"翻过这一页，往前走……");
  setTimeout(()=>{
    transTxt.innerHTML=msg; trans.classList.add("on");
    setTimeout(()=>{ trans.classList.remove("on"); S.busy=false; if(last) renderEnding(); else gotoQuestion(i+1); },2000);
  },280);
}
function goPrev(i){
  if(i<=0) return;
  // 回到上一题；保留上一题的答案快照机制，不改后续答案（只有改选才清空）
  renderQuestion(i-1);
}
function gotoQuestion(i){ renderQuestion(i); }
function rollNum(el,target,dur){
  let t0=null;
  function step(ts){ if(t0===null)t0=ts; const p=Math.min(1,(ts-t0)/dur); const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e); if(p<1)requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
function bookCard(bk, roleLabel, score, extra){
  const cover=`<div class="cover">${bk.emoji||"📕"}</div>`;
  const meta=(bk.author&&bk.author!=="待确认")?bk.author:"";
  return `<div class="book main" data-score="${score}">
    ${cover}
    <div class="bi"><span class="role">${roleLabel}</span>
      <div class="bname">《${bk.name}》</div>
      ${meta?`<div class="bmeta">${meta}</div>`:""}
      <div class="bpitch">${bk.pitch}</div>${extra||""}</div>
    <div class="match"><div class="num">0</div><div class="pct">匹配度</div></div>
  </div>`;
}
function renderEnding(){
  S.screen="ending"; setDots(); replayBtn.classList.add("show");
  // 结局ID = 第二层卡点(q2) - 第一层文体簇序号(q1映射)
  const clusterId=DATA.q1ToCluster[S.answers.q1];
  const id=[S.answers.q2,clusterId].join("-");
  const end=DATA.endings[id];
  console.log("[专项版] 结局ID:",id,"| 风格(q3):",S.answers.q3,"| 文体(q1):",S.answers.q1,"| 确认(q4):",S.answers.q4);
  if(!end){
    stage.innerHTML=`<div class="res-head"><div class="res-tag">未收录</div><h1 class="res-title">这条路暂时没有书目</h1>
      <p class="guide">你走出了 ${id}，这条路径暂不在 20 个画像里。可点底部「重新走一条路」再试。</p></div>`;
    return;
  }
  // 第三层 q3 决定主攻书
  const sKey=DATA.styleKey[S.answers.q3];
  const mainId=end.main[sKey];
  const mainBook=getBook(mainId)||{name:mainId,pitch:"",emoji:"📕",author:"待确认",publisher:"待确认",family:"小说"};
  const styleLabel=DATA.styleName[sKey];
  const score=calcMatch(90,mainBook.family.split("/")[0],S.tone);
  const cross=end.crossNote&&end.crossNote[sKey];
  const auxOverride=(end.aux&&end.aux[sKey])||null;
  const suppId=auxOverride?auxOverride.supp:end.supp;
  const extId=auxOverride?auxOverride.ext:end.ext;

  const auxBooks=[getBook(suppId),getBook(extId)].filter(Boolean);
  const auxHtml=auxBooks.map((bk,i)=>`
    <div class="rec"><div class="rn">${i+1}</div><div class="rb">
      <div class="rname">《${bk.name}》<span class="rrole">${i===0?"补短":"扩展"}</span></div>
      <div class="rtext">${bk.pitch}</div>
    </div></div>`).join("");

  const recs=buildRecommendations(end,mainBook,suppId,extId,S.tone,S.block);
  const recHtml=recs.map((r,i)=>`
    <div class="rec"><div class="rn">${i+1}</div><div class="rb">
      <div class="rname">《${r.name}》<span class="rrole">${r.roleLabel}</span></div>
      <div class="rtext">${r.text}</div>
    </div></div>`).join("");

  const extra=cross?`<div class="bmeta" style="color:var(--red);margin-top:5px">※ ${cross}</div>`:"";
  stage.innerHTML=`
    <div class="res-head">
      <div class="res-tag">${end.path} · ${id}</div>
      <h1 class="res-title">${end.title}</h1>
      <div class="guide">${end.guide}</div>
    </div>
    <div class="sec-t">今晚该翻开的第一本 · ${styleLabel}</div>
    <div id="books">${bookCard(mainBook,styleLabel,score,extra)}</div>
    <div class="sec-t">另外 ${auxBooks.length} 本，等你想深入时再翻</div>
    <div class="rec-list" id="auxList">${auxHtml}</div>
    <button class="rec-more" id="auxMore" aria-expanded="false"><span class="tri">▼</span><span class="more-tx">展开这 ${auxBooks.length} 本</span></button>
    <div class="sec-t">还有 ${recs.length} 本相关的，想去看看吗？</div>
    <div class="rec-list" id="recList">${recHtml}</div>
    <button class="rec-more" id="recMore" aria-expanded="false"><span class="tri">▼</span><span class="more-tx">展开这 ${recs.length} 本</span></button>
    ${end.dataNotes&&end.dataNotes.length?`<div class="hint" style="margin-top:14px;text-align:left">※ ${end.dataNotes.join('<br>※ ')}</div>`:''}
    <div class="hint" style="margin-top:20px">匹配度：基础分 ± 文体校准（封顶 95 / 保底 80）· 主攻书随你选的方法风格切换，补短与扩展折叠</div>
    ${feedbackHtml(id)}`;

  const mainEl=stage.querySelector("#books .book");
  setTimeout(()=>{ mainEl.classList.add("in"); rollNum(mainEl.querySelector(".num"),score,900); },200);
  setTimeout(()=>{
    ["auxList","recList"].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.add("in");});
    ["auxMore","recMore"].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.add("in");});
  },700);
  [["auxMore","auxList"],["recMore","recList"]].forEach(([bid,lid])=>{
    const btn=document.getElementById(bid); if(!btn) return;
    btn.onclick=function(){
      const list=document.getElementById(lid);
      const opened=list.classList.toggle("open");
      this.classList.toggle("open",opened);
      this.setAttribute("aria-expanded",opened?"true":"false");
      this.querySelector(".more-tx").textContent=opened?"收起":`展开这 ${list.querySelectorAll(".rec").length} 本`;
    };
  });

  initFeedback();
}
replayBtn.onclick=()=>{
  S={screen:"intro",qi:0,answers:{},style:null,tone:null,block:null,busy:false};QHISTORY=[];START_ANSWERS={};
  renderIntro(); window.scrollTo({top:0,behavior:"smooth"});
};
renderIntro();

</script>
